name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Run commitlint
        run: npx commitlint --from=origin/main --to=HEAD --extends @commitlint/config-conventional

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .[test] 2>/dev/null || pip install -e .

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q src

      - name: Observability endpoints
        run: |
          grep -R --include='*.py' -E '/health|/metrics' src || echo "No /health or /metrics in service source"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: pip-audit and bandit
        run: |
          pip install pip-audit bandit
          pip-audit
          bandit -r src -ll