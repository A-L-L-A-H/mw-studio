name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Check conventional commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s origin/main..HEAD | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert|security|deps|style|release)(\(.+\))?!?: .+' || { echo "Invalid: $msg"; exit 1; }
          done

      - name: Install dependencies
        run: |
          pip install -e .[test] 2>/dev/null || pip install -e .

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q src

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
